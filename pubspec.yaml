name: appimage_studio
description: "A modern desktop studio to package and distribute standalone Linux AppImage applications."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  app_image: ^1.0.18
  file_picker: ^8.3.7
  path: ^1.9.1
  http: ^1.6.0
  url_launcher: ^6.3.3
  desktop_drop: ^0.8.4
  flutter_svg: ^2.0.10
  yaml: ^3.1.2
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  linux: true
  image_path: "assets/images/app_icon.png"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/bin/appimagetool
    - assets/icon.png
    - assets/images/app_icon.png
